<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EazyLook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fd6">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:#f3f5f9;color:#1b1f27;padding-bottom:70px}
header{position:sticky;top:0;background:#1f5fd6;color:#fff;padding:10px 14px;font-weight:600;z-index:5;display:flex;justify-content:space-between}
main{max-width:900px;margin:auto;padding:10px}
.hint{background:#fff8dc;border:1px solid #ecd98a;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e8ecf4;margin-right:4px}
.st{color:#fff;padding:2px 10px;border-radius:99px;font-size:13px}
.it{font-size:14px;color:#444;border-top:1px dashed #ddd;padding:4px 0}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:12px 16px;background:#1f5fd6;color:#fff;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn.off{background:#c9ced8;color:#555}.btn.sec{background:#e8ecf4;color:#1b1f27}
input,select,textarea{width:100%;padding:10px;border:1px solid #bbc;border-radius:10px;margin:4px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccd}
.tabs button{flex:1;padding:14px 4px;border:0;background:none;font-weight:600;color:#667}.tabs .on{color:#1f5fd6;border-top:3px solid #1f5fd6}
.full{position:fixed;inset:0;background:#f3f5f9;z-index:20;overflow:auto;padding:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:2px 8px;font-size:14px}.kv b{color:#667;font-weight:500}
.why{font-size:12px;color:#a33}
</style></head><body>
<header><span>EazyLook</span><span id="who" onclick="settings()" style="cursor:pointer"></span></header>
<main id="app"></main>
<div class="tabs" id="tabs" hidden></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='453855640121-0o20r40ti8vjgtpkmkdhdomdrhttmo1i.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/spreadsheets';
const SH={
'Заказы':['№','Канал','Тип оплаты','Дата','ФИО','Телефон','Перевозчик','ТТН','Состояние посылки','Дата отправки','Дата получения','От ФОП','Условие доставки','Стоимость доставки','Возвратная ТТН','Стоимость возвратной доставки','Аванс','Аванс получен','Выкуп','Комиссия сайта','Комиссия банка','Выплата','Профит','Реал','Статус','Чек выдан'],
'Товары':['№ заказа','Название','Код','Размер','Цвет','Количество','Цена за шт','Стоимость закупки','Закуплено шт'],
'Журнал':['ID','Дата','Кто','Тип','№ заказа','Счёт','Сумма','Остаток после','Описание','Отменена'],
'Склад':['Код','Название','Размер','Цвет','Количество','Цена закупки','Из заказа'],
'Поставщики':['Наш номер','Поставщик','Улица','Контейнер','Актуальный ассортимент','Популярность'],
'Настройки':['Ключ','Значение']};
const ST={'Ожидает подтверждения':'#8a96a8','Новый':'#2a6df4','Закуплен':'#8e44ad','Отправлен':'#d99a00','Выполнен':'#1a9b4b','Отказ':'#d33','Возврат':'#a0201a','Закрыт':'#666','Отменен':'#999'};
const ACTIVE=['Ожидает подтверждения','Новый','Закуплен','Отправлен','Возврат'];
const ACTIONS=['Закупка товара','Отправка заказов','Возврат посылок','Возврат средств','Получение аванса','Выдача чеков','Изменение баланса','Возврат заказа','Возврат комиссии','Сдача товара'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v??'').replace(',','.').replace(/\s/g,''))||0;
const money=v=>num(v).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₴';
const fdate=v=>{const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('ru-RU')};
const fdt=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
let tok=null,tc=null,SID=localStorage.sid,ME=localStorage.me,S={orders:[],items:[],log:[],cfg:[],tab:'orders',flt:'all',q:''};

function auth(){return new Promise((ok,no)=>{
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>r.access_token?(tok=r.access_token,ok()):no(new Error(r.error||'auth'))});
 tc.requestAccessToken({prompt:''});});}
async function g(p,o={}){
 const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SID+p,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
 if(r.status==401){tok=null;throw new Error('auth')}
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Ошибка Google');return j}
const put=(t,v)=>g('/values/'+encodeURIComponent(t)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:v})});
const app=(t,v)=>g('/values/'+encodeURIComponent(t)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:v})});

async function ensure(){
 const m=await g('?fields=sheets.properties.title'),have=m.sheets.map(s=>s.properties.title),add=Object.keys(SH).filter(k=>!have.includes(k));
 if(add.length){await g(':batchUpdate',{method:'POST',body:JSON.stringify({requests:add.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))})});
  for(const t of add)await put(t+'!A1',[SH[t]]);}}
async function load(){
 const ks=Object.keys(SH),d=await g('/values:batchGet?'+ks.map(k=>'ranges='+encodeURIComponent(k)).join('&')),T={};
 d.valueRanges.forEach((v,i)=>{const r=v.values||[],h=r[0]||SH[ks[i]];T[ks[i]]=r.slice(1).map((row,j)=>{const o={_row:j+2};h.forEach((k,c)=>o[k]=row[c]??'');return o})});
 S.orders=T['Заказы'];S.items=T['Товары'];S.log=T['Журнал'];S.cfg=T['Настройки']}
async function addLog(type,order,desc,amount='',acct=''){
 const row=[Date.now(),new Date().toISOString(),ME,type,order,acct,amount,'',desc,''];
 await app('Журнал!A1',[row]);
 S.log.push({ID:row[0],'Дата':row[1],'Кто':ME,'Тип':type,'№ заказа':order,'Описание':desc,'Сумма':amount,'Счёт':acct})}
const seenKey=()=>'seen:'+ME,seenRow=()=>S.cfg.find(r=>r['Ключ']==seenKey());
async function setSeen(){const now=new Date().toISOString(),r=seenRow();
 if(r){await put('Настройки!B'+r._row,[[now]]);r['Значение']=now}else{await app('Настройки!A1',[[seenKey(),now]]);S.cfg.push({'Ключ':seenKey(),'Значение':now,_row:S.cfg.length+2})}}
function news(){const r=seenRow();if(!r)return[];const t=Date.parse(r['Значение']);
 return S.log.filter(e=>Date.parse(e['Дата'])>t&&e['Кто']!=ME&&e['Отменена']!='Да').reverse()}

const itemsOf=o=>S.items.filter(i=>i['№ заказа']==o['№']);
const total=o=>itemsOf(o).reduce((s,i)=>s+num(i['Цена за шт'])*(num(i['Количество'])||1),0);
const allBought=o=>{const it=itemsOf(o);return it.length>0&&it.every(i=>num(i['Закуплено шт'])>=(num(i['Количество'])||1))};
function can(o){ // что можно делать с заказом в его состоянии
 const s=o['Статус'],adv=o['Аванс получен']=='Да',r=[];
 const A=(n,ok,why)=>r.push({n,ok,why});
 A('Добавить комментарий',true);
 A('Изменить заказ (товары, данные)',['Ожидает подтверждения','Новый','Закуплен'].includes(s),'Заказ уже отправлен или закрыт');
 A('Отметить закупку (вкладка «Действия»)',['Новый','Закуплен'].includes(s)&&!allBought(o),allBought(o)?'Всё уже закуплено':'Заказ не в стадии закупки');
 A('Получить аванс',num(o['Аванс'])>0&&!adv&&!['Закрыт','Отменен'].includes(s),num(o['Аванс'])>0?'Аванс уже получен или заказ закрыт':'У заказа нет аванса');
 A('Указать или изменить ТТН',!['Закрыт','Отменен'].includes(s),'Заказ закрыт');
 A('Отправить заказ',['Новый','Закуплен'].includes(s)&&allBought(o),'Сначала нужно закупить все товары');
 A('Оформить возврат заказа',s=='Выполнен','Возврат возможен только у выполненных заказов (14 дней)');
 const bad=['Отправлен','Выполнен','Возврат','Отказ','Закрыт','Отменен'].includes(s)?'Посылка уже в пути или заказ завершён':adv?'Получен аванс: сначала верните деньги клиенту':'';
 A('Отменить заказ',!bad,bad);
 return r}

function render(){
 $('#who').textContent=(ME?ME+' · ':'')+'⚙ Настройки';
 const t=$('#tabs');t.hidden=!tok;
 t.innerHTML=[['orders','Заказы'],['act','Действия'],['log','Журнал']].map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${n}</button>`).join('');
 const a=$('#app');
 if(!SID||!ME)return a.innerHTML=`<div class="card"><h3>Первая настройка</h3>
  <div class="hint">Откройте вашу Google Таблицу и скопируйте адрес из строки браузера целиком, вставьте сюда.</div>
  <input id="sid" placeholder="Адрес или ID Google Таблицы" value="${esc(SID||'')}">
  <div class="hint">Кто вы? Введите своё имя (оно нужно, чтобы показывать вам только чужие изменения).</div>
  <input id="me" placeholder="Ваше имя" value="${esc(ME||'')}">
  <button class="btn" onclick="saveCfg()">Сохранить</button></div>`;
 if(!tok)return a.innerHTML=`<div class="card"><h3>Вход</h3><div class="hint">Нажмите кнопку и выберите рабочий аккаунт Google.</div>
  <button class="btn" onclick="start()">Войти через Google</button><div id="err"></div></div>`;
 if(S.tab=='orders')return a.innerHTML=ordersHtml();
 if(S.tab=='act')return a.innerHTML=`<div class="hint">Здесь будут все рабочие действия: выберите, что хотите сделать. Раздел появится в следующей версии.</div>`+ACTIONS.map(n=>`<div class="card">${n}<div class="why">Скоро</div></div>`).join('');
 a.innerHTML=`<div class="hint">Журнал: что, когда и по какому заказу происходило.</div>`+S.log.slice(-100).reverse().map(e=>`<div class="card"><div class="row"><b>${esc(e['Тип'])}</b><span>${fdt(e['Дата'])}</span></div>${e['№ заказа']?'Заказ '+esc(e['№ заказа'])+' · ':''}${esc(e['Описание'])}${e['Сумма']?' · '+money(e['Сумма']):''}</div>`).join('')||'<div class="card">Пока пусто</div>'}
function ordersHtml(){
 let L=S.orders.filter(o=>o['№']);const q=S.q.toLowerCase(),m=Date.now()-30*864e5;
 if(S.flt=='act')L=L.filter(o=>ACTIVE.includes(o['Статус']));
 if(S.flt=='mon')L=L.filter(o=>Date.parse(o['Дата'])>=m);
 if(q)L=L.filter(o=>(o['№']+o['ФИО']+o['Телефон']+o['ТТН']+itemsOf(o).map(i=>i['Код']+i['Название']).join(' ')).toLowerCase().includes(q));
 L.sort((a,b)=>(Date.parse(b['Дата'])||0)-(Date.parse(a['Дата'])||0)||b._row-a._row);
 return `<div class="hint">Нажмите на заказ, чтобы открыть его и посмотреть, что с ним можно сделать.</div>
 <input placeholder="Поиск: номер, имя, телефон, ТТН, код" value="${esc(S.q)}" oninput="S.q=this.value;render();this.focus()">
 <div>${[['all','За всё время'],['mon','За месяц'],['act','Активные']].map(([k,n])=>`<button class="btn ${S.flt==k?'':'sec'}" onclick="S.flt='${k}';render()">${n}</button>`).join('')}</div>`+
 (L.map(o=>`<div class="card" onclick="openOrder('${esc(o['№'])}')"><div class="row"><b>№ ${esc(o['№'])}</b><span class="st" style="background:${ST[o['Статус']]||'#888'}">${esc(o['Статус']||'—')}</span></div>
 <div><span class="chip">${esc(o['Канал'])}</span><span class="chip">${esc(o['Тип оплаты']||'тип оплаты не указан')}</span></div>
 <div class="row"><span>${esc(o['ФИО'])}</span><b>${money(total(o))}</b></div>${itemsOf(o).map(i=>`<div class="it">${esc(i['Код'])} · ${esc(i['Размер'])} · ${esc(i['Цвет'])} × ${esc(i['Количество']||1)}${i['Название']?' · '+esc(i['Название']):''}</div>`).join('')}</div>`).join('')||'<div class="card">Заказов не найдено</div>')}
function openOrder(n){
 const o=S.orders.find(x=>x['№']==n);if(!o)return;const d=document.createElement('div');d.className='full';d.id='ord';
 const F=['Канал','Тип оплаты','Дата','ФИО','Телефон','Перевозчик','ТТН','Состояние посылки','Условие доставки','Стоимость доставки','Аванс','Аванс получен','Выкуп','Комиссия сайта','Комиссия банка','Выплата','Профит','Реал','Чек выдан'];
 const cm=S.log.filter(e=>e['Тип']=='Комментарий'&&e['№ заказа']==n).reverse();
 d.innerHTML=`<button class="btn sec" onclick="this.parentNode.remove()">← Назад к заказам</button><h2>Заказ № ${esc(n)} <span class="st" style="background:${ST[o['Статус']]||'#888'}">${esc(o['Статус'])}</span></h2>
 <div class="card kv">${F.filter(k=>o[k]!=='').map(k=>`<b>${k}</b><span>${k=='Дата'?fdate(o[k]):esc(o[k])}${k=='Телефон'?` <a href="#" onclick="navigator.clipboard.writeText('${esc(o[k])}');return false">копировать</a>`:''}</span>`).join('')}</div>
 <div class="card"><b>Товары</b>${itemsOf(o).map(i=>`<div class="it">${esc(i['Название'])} ${esc(i['Код'])} · ${esc(i['Размер'])} · ${esc(i['Цвет'])} × ${esc(i['Количество'])} · ${money(i['Цена за шт'])} · куплено ${esc(i['Закуплено шт']||0)}</div>`).join('')||'Товаров нет'}</div>
 <div class="card"><b>Что можно сделать</b><div class="hint">Серые кнопки сейчас недоступны, под ними написана причина.</div>${can(o).map((a,i)=>`<div><button class="btn ${a.ok?'':'off'}" onclick="${a.ok?(i==0?"$('#cm').focus()":"alert('Эта функция появится в следующей версии')"):`alert('${esc(a.why)}')`}">${a.n}</button>${a.ok?'':`<div class="why">${esc(a.why)}</div>`}</div>`).join('')}</div>
 <div class="card"><b>Комментарии</b><textarea id="cm" rows="2" placeholder="Напишите комментарий к заказу"></textarea><button class="btn" onclick="addCm('${esc(n)}')">Добавить комментарий</button>
 ${cm.map(e=>`<div class="it">${fdt(e['Дата'])} · ${esc(e['Кто'])}: ${esc(e['Описание'])}</div>`).join('')}</div>`;
 document.body.append(d)}
async function addCm(n){const t=$('#cm').value.trim();if(!t)return;try{await addLog('Комментарий',n,t);$('#ord').remove();render();openOrder(n)}catch(e){alert('Не удалось сохранить: '+e.message)}}
function settings(){if(!confirm('Сменить таблицу или имя? Вы выйдете из приложения и сможете ввести новые данные.'))return;
 try{if(tok)google.accounts.oauth2.revoke(tok)}catch(e){}
 tok=null;SID=ME=undefined;localStorage.removeItem('sid');localStorage.removeItem('me');S.orders=[];S.items=[];S.log=[];S.cfg=[];render()}
function saveCfg(){const m=($('#sid').value||'').match(/\/d\/([\w-]+)/),id=m?m[1]:($('#sid').value||'').trim(),me=$('#me').value.trim();
 if(!id||!me)return alert('Заполните оба поля');SID=localStorage.sid=id;ME=localStorage.me=me;render()}
async function start(){
 try{await auth();$('#app').innerHTML='<div class="card">Загружаю данные…</div>';await ensure();await load();
  const r=seenRow(),n=news();render();
  if(!r){await setSeen()}else if(n.length)showNews(n);else await setSeen()}
 catch(e){tok=null;render();$('#err').innerHTML=`<div class="hint">Не получилось: ${esc(e.message)}. Проверьте адрес таблицы и доступ аккаунта.</div>`}}
function showNews(n){const d=document.createElement('div');d.className='full';
 d.innerHTML=`<h2>Что нового, пока вас не было</h2><div class="hint">Это изменения других людей с вашего прошлого визита.</div>`+
 n.slice(0,200).map(e=>`<div class="card"><div class="row"><b>${esc(e['Тип'])}</b><span>${fdt(e['Дата'])} · ${esc(e['Кто'])}</span></div>${e['№ заказа']?'Заказ '+esc(e['№ заказа'])+' · ':''}${esc(e['Описание'])}</div>`).join('')+
 `<button class="btn" onclick="this.parentNode.remove();setSeen()">Понятно, продолжить</button>`;document.body.append(d)}
window.addEventListener('load',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render()});
</script></body></html>
