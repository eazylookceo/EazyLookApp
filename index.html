<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EazyLook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fd6">
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#161a2b;--mu:#6b7191;--ac:#5b5bd6;--ac2:#8b5cf6;--ln:#e6e8f2;--sh:0 6px 18px #1b1f4a14}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--cd:#181c30;--tx:#eceefb;--mu:#9aa1c4;--ln:#262b47;--sh:0 6px 18px #0007}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:19px;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
#who{font-size:13px;font-weight:600;background:#fff3;padding:6px 12px;border-radius:99px;cursor:pointer}
main{max-width:860px;margin:auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hint{background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:13.5px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);margin:4px 4px 0 0}
.st{color:#fff;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.it{font-size:13.5px;color:var(--mu);padding:5px 0;border-top:1px solid var(--ln)}
.btn{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:var(--ln);color:var(--tx)}.btn.off{background:var(--ln);color:var(--mu);opacity:.7}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;margin:6px 0;background:var(--cd);color:var(--tx);font:inherit}
.tabs{position:fixed;left:12px;right:12px;bottom:12px;display:flex;background:var(--cd);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:6px;z-index:6;max-width:520px;margin:auto}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:18px;color:var(--mu);font-weight:600;font-size:12px;font-family:inherit}.tabs i{display:block;font-style:normal;font-size:20px}.tabs .on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.full{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px}.kv b{color:var(--mu);font-weight:500}
.why{font-size:12px;color:#d9485f;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px 12px;box-shadow:var(--sh);cursor:pointer}.tile.dim{opacity:.55}.tile .ic{font-size:28px}.tile small{display:block;color:var(--mu)}
.bdg{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.sech{margin:18px 4px 4px;font-size:15px}.big{font-size:17px;font-weight:700;margin:6px 0 2px}.mu{color:var(--mu);font-size:13px}
.toast{position:fixed;left:12px;right:12px;bottom:92px;max-width:480px;margin:auto;background:#161a2b;color:#fff;border-radius:16px;padding:12px 16px;z-index:30;box-shadow:var(--sh)}.toast button{float:right;border:0;background:#fff3;color:#fff;border-radius:10px;padding:4px 12px}
.art{font-size:24px;font-weight:800;color:var(--ac)}.qty{font-size:20px;font-weight:800;background:color-mix(in srgb,var(--ac) 14%,transparent);padding:2px 12px;border-radius:12px}
.cost{font-size:20px;font-weight:800}.cost small{font-size:12px;font-weight:500;color:var(--mu)}.cont{font-weight:700;margin-top:6px}
.sum{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.sum .mu{color:#ffffffcc}.sum .big{font-size:28px;margin:2px 0}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:99px}
.rc{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-right:6px}.rc.ok{background:#dcfce7;color:#15803d}.rc.no{background:var(--ln);color:var(--mu)}.rc.no.due{background:#fee2e2;color:#b91c1c}
</style></head><body>
<header><span>EazyLook</span><span id="who" onclick="settings()" style="cursor:pointer"></span></header>
<main id="app"></main>
<div class="tabs" id="tabs" hidden></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='453855640121-0o20r40ti8vjgtpkmkdhdomdrhttmo1i.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email';
let ares=null;
const SH={
'Заказы':['№','Канал','Тип оплаты','Дата','ФИО','Телефон','Перевозчик','ТТН','Состояние посылки','Дата отправки','Дата получения','От ФОП','Условие доставки','Стоимость доставки','Возвратная ТТН','Стоимость возвратной доставки','Аванс','Аванс получен','Выкуп','Комиссия сайта','Комиссия банка','Выплата','Профит','Реал','Статус','Чек выдан','Возвращено клиенту','Комиссия сайта возвращена'],
'Товары':['№ заказа','Название','Код','Размер','Цвет','Количество','Цена за шт','Стоимость закупки','Закуплено шт'],
'Журнал':['ID','Дата','Кто','Тип','№ заказа','Счёт','Сумма','Остаток после','Описание','Отменена'],
'Склад':['Код','Название','Размер','Цвет','Количество','Цена закупки','Из заказа'],
'Поставщики':['Наш номер','Поставщик','Улица','Контейнер','Актуальный ассортимент','Популярность'],
'Настройки':['Ключ','Значение']};
const ST={'Ожидает подтверждения':'#8a96a8','Новый':'#2a6df4','Закуплен':'#8e44ad','Отправлен':'#d99a00','Выполнен':'#1a9b4b','Отказ':'#d33','Возврат':'#a0201a','Закрыт':'#666','Отменен':'#999'};
const ACTIVE=['Ожидает подтверждения','Новый','Закуплен','Отправлен','Возврат'];
const ACTIONS=['Закупка товара','Отправка заказов','Возврат посылок','Возврат средств','Получение аванса','Выдача чеков','Изменение баланса','Возврат заказа','Возврат комиссии','Сдача товара'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v??'').replace(',','.').replace(/\s/g,''))||0;
const money=v=>num(v).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₴';
const fdate=v=>{const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('ru-RU')};
const fdt=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
let tok=null,tc=null,SID=localStorage.sid,ME=localStorage.me,S={orders:[],items:[],log:[],cfg:[],sup:[],stock:[],sub:'',ch:'',tab:'orders',flt:'all',q:''};

function auth(){return new Promise((ok,no)=>{ares={ok,no};
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
  callback:r=>{if(r.access_token){tok=r.access_token;localStorage.tk=JSON.stringify({tok,exp:Date.now()+(r.expires_in-120)*1000});
   if(!localStorage.em)fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(x=>x.json()).then(j=>{if(j.email)localStorage.em=j.email}).catch(()=>{});ares.ok()}else ares.no(new Error(r.error||'auth'))},
  error_callback:e=>ares.no(new Error(e.type||'popup'))});
 tc.requestAccessToken({prompt:'',hint:localStorage.em||undefined})});}
async function g(p,o={},retry=1){
 const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SID+p,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
 if(r.status==401){tok=null;localStorage.removeItem('tk');if(retry){await auth();return g(p,o,0)}throw new Error('auth')}
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Ошибка Google');return j}
const put=(t,v)=>g('/values/'+encodeURIComponent(t)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:v})});
const app=(t,v)=>g('/values/'+encodeURIComponent(t)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:v})});

async function ensure(){
 const m=await g('?fields=sheets.properties.title'),have=m.sheets.map(s=>s.properties.title),add=Object.keys(SH).filter(k=>!have.includes(k));
 if(add.length){await g(':batchUpdate',{method:'POST',body:JSON.stringify({requests:add.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))})});
  for(const t of add)await put(t+'!A1',[SH[t]]);}}
async function load(){
 const ks=Object.keys(SH),d=await g('/values:batchGet?'+ks.map(k=>'ranges='+encodeURIComponent(k)).join('&')),T={};
 d.valueRanges.forEach((v,i)=>{const r=v.values||[],h=r[0]||SH[ks[i]];T[ks[i]]=r.slice(1).map((row,j)=>{const o={_row:j+2};h.forEach((k,c)=>o[k]=row[c]??'');return o})});
 S.orders=T['Заказы'];S.items=T['Товары'];S.log=T['Журнал'];S.cfg=T['Настройки'];S.sup=T['Поставщики'];S.stock=T['Склад']}
const rnd=x=>Math.round(x*100)/100,colL=n=>String.fromCharCode(65+n);
const wr=(o,v)=>Object.entries(v).map(([k,x])=>({r:'Заказы!'+colL(SH['Заказы'].indexOf(k))+o._row,v:x,p:o[k]}));
const wi=(i,v)=>Object.entries(v).map(([k,x])=>({r:'Товары!'+colL(SH['Товары'].indexOf(k))+i._row,v:x,p:i[k]}));
function calc(o,its=itemsOf(o)){
 const ln=i=>num(i['Цена за шт'])*(num(i['Количество'])||1),lc=i=>num(i['Стоимость закупки'])*(num(i['Количество'])||1),sum=its.reduce((s,i)=>s+ln(i),0),buy=its.reduce((s,i)=>s+lc(i),0),os=itemsOf(o).reduce((s,i)=>s+ln(i),0);
 const ch=o['Канал'],ty=o['Тип оплаты']||'',pre=/Пром-оплата|частинами|Безопасная|Monobank/i.test(ty),vy=pre?sum:Math.max(sum-num(o['Аванс']),0),old=num(o['Комиссия сайта']);let site=old,bank=num(o['Комиссия банка']);
 if(ch=='Шафа')site=its.reduce((s,i)=>{const l=ln(i);return s+Math.min(Math.max(l*(l<=500?.2:l<=1000?.17:.13),30),500)},0);
 else if(ch=='Эпицентр'||ch=='Пром')site=old>0&&os>0?old/os*sum:(ch=='Эпицентр'?sum*.14:old);
 if(ch=='Наложка'||ch=='Пром'||ty){if(pre)bank=sum*({'Шафа':.015,'Пром':.017,'Эпицентр':.013}[ch]||0);else if(ch=='Эпицентр')bank=0;else if(ch=='Наложка')bank=o['От ФОП']=='Да'?vy*.005:0;else bank=vy*.005}
 return {'Выкуп':rnd(vy),'Комиссия сайта':rnd(site),'Комиссия банка':rnd(bank),'Выплата':rnd(vy-bank),'Профит':rnd(sum-site-bank-num(o['Стоимость доставки'])-buy)}}
async function addLog(type,order,desc,amount='',acct=''){
 const row=[Date.now()+Math.floor(Math.random()*1e3),new Date().toISOString(),ME,type,order,acct,amount,'',desc,''];
 const r=await app('Журнал!A1',[row]),m=String(r.updates?.updatedRange||'').match(/(\d+):/);
 const e={ID:row[0],'Дата':row[1],'Кто':ME,'Тип':type,'№ заказа':order,'Описание':desc,'Сумма':amount,'Счёт':acct,'Отменена':'',_row:m?+m[1]:0};S.log.push(e);return e}
const bu=d=>g('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:d})});
async function act({data,upd,logs,msg,add=[]}){
 const old=upd.map(([o,n])=>[o,Object.fromEntries(Object.keys(n).map(k=>[k,o[k]]))]);
 if(data.length)await bu(data.map(d=>({range:d.r,values:[[d.v]]})));
 upd.forEach(([o,n])=>Object.assign(o,n));
 const ad=[];for(const a of add){const r=await app(a.sheet+'!A1',a.rows),rg=r.updates.updatedRange,m=+(rg.match(/(\d+):/)||[0,0])[1];a.objs.forEach((o,k)=>o._row=m+k);ad.push({rg,objs:a.objs});S.stock.push(...a.objs)}
 const es=[];for(const l of logs)es.push(await addLog(...l));
 render();
 toast(msg,async()=>{try{
  if(data.length)await bu(data.map(d=>({range:d.r,values:[[d.p]]})));
  old.forEach(([o,n])=>Object.assign(o,n));
  if(ad.length){await g('/values:batchClear',{method:'POST',body:JSON.stringify({ranges:ad.map(x=>x.rg)})});ad.forEach(x=>x.objs.forEach(o=>{const k=S.stock.indexOf(o);if(k>=0)S.stock.splice(k,1)}))}
  for(const e of es){if(e['Тип']=='Комментарий'){await put('Журнал!J'+e._row,[['Да']]);e['Отменена']='Да'}else await addLog('Отмена',e['№ заказа'],'Отмена: '+e['Описание'],e['Сумма']===''?'':-num(e['Сумма']),e['Счёт'])}
  render();const on=es[0]&&es[0]['№ заказа'];if($('#ord')&&on){$('#ord').remove();openOrder(on)}toast('Действие отменено')}catch(x){alert('Не удалось отменить: '+x.message)}})}
async function fixHdr(){const hd=((await g('/values/'+encodeURIComponent('Заказы!1:1'))).values||[[]])[0];if(hd.length<SH['Заказы'].length)await put('Заказы!A1',[SH['Заказы']])}
const needR=o=>o['Канал']=='Шафа'||o['Канал']=='Эпицентр'||(o['Канал']=='Наложка'&&o['От ФОП']=='Да');
const rcp=o=>needR(o)?(o['Чек выдан']=='Да'?'<span class="rc ok" title="Чек выдан">🧾 ✓</span>':`<span class="rc no${o['Статус']=='Выполнен'?' due':''}" title="Чек не выдан">🧾 ✗</span>`):'';
const chkL=()=>S.orders.filter(o=>needR(o)&&o['Статус']=='Выполнен'&&o['Чек выдан']!='Да');
function chkHtml(){const L=chkL();return back+sumc('Нужно выдать чеки',L.length+' заказов','на сумму '+money(L.reduce((s,o)=>s+total(o),0)))+`<div class="hint">Чеки нужны по Наложке (от ФОП), Шафе и Эпицентру. По Прому чек выдаётся автоматически или создаётся на Проме. Выдали чек? Нажмите «Чек выдан».</div>`+
 (L.map(o=>`<div class="card"><div class="row"><b>№ ${esc(o['№'])}</b><span class="chip">${esc(o['Канал'])}</span></div><div class="big">${esc(o['ФИО'])}</div><div class="mu">Сумма ${money(total(o))} · ТТН ${esc(o['ТТН'])}</div><button class="btn" onclick="chk(${o._row})">🧾 Чек выдан</button></div>`).join('')||'<div class="card">Все чеки выданы 🎉</div>')}
async function chk(row){const o=S.orders.find(x=>x._row==row),v={'Чек выдан':'Да'};try{await act({data:wr(o,v),upd:[[o,v]],logs:[['Чек',o['№'],'Чек выдан']],msg:'Чек отмечен: заказ '+o['№']})}catch(e){alert('Не удалось сохранить: '+e.message)}}
const seenKey=()=>'seen:'+ME,seenRow=()=>S.cfg.find(r=>r['Ключ']==seenKey());
async function setSeen(){const now=new Date().toISOString(),r=seenRow();
 if(r){await put('Настройки!B'+r._row,[[now]]);r['Значение']=now}else{await app('Настройки!A1',[[seenKey(),now]]);S.cfg.push({'Ключ':seenKey(),'Значение':now,_row:S.cfg.length+2})}}
function news(){const r=seenRow();if(!r)return[];const t=Date.parse(r['Значение']);
 return S.log.filter(e=>Date.parse(e['Дата'])>t&&e['Кто']!=ME&&e['Отменена']!='Да').reverse()}

const itemsOf=o=>S.items.filter(i=>i['№ заказа']==o['№']);
const total=o=>itemsOf(o).reduce((s,i)=>s+num(i['Цена за шт'])*(num(i['Количество'])||1),0);
const allBought=o=>{const it=itemsOf(o);return it.length>0&&it.every(i=>num(i['Закуплено шт'])>=(num(i['Количество'])||1))};
function can(o){ // что можно делать с заказом в его состоянии
 const s=o['Статус'],adv=o['Аванс получен']=='Да',r=[];
 const A=(n,ok,why,fn)=>r.push({n,ok,why,fn});
 A('Добавить комментарий',true);
 A('Изменить заказ (товары, данные)',['Ожидает подтверждения','Новый','Закуплен'].includes(s),'Заказ уже отправлен или закрыт');
 A('Отметить закупку (вкладка «Действия»)',['Новый','Закуплен'].includes(s)&&!allBought(o),allBought(o)?'Всё уже закуплено':'Заказ не в стадии закупки');
 A('Получить аванс',num(o['Аванс'])>0&&!adv&&!['Закрыт','Отменен'].includes(s),num(o['Аванс'])>0?'Аванс уже получен или заказ закрыт':'У заказа нет аванса');
 A('Указать или изменить ТТН',!['Закрыт','Отменен'].includes(s),'Заказ закрыт');
 A('Отправить заказ',['Новый','Закуплен'].includes(s)&&allBought(o),'Сначала нужно закупить все товары');
 A('Оформить возврат заказа',s=='Выполнен','Возврат возможен только у выполненных заказов (14 дней)');
 const bad=['Отправлен','Выполнен','Возврат','Отказ','Закрыт','Отменен'].includes(s)?'Посылка уже в пути или заказ завершён':adv?'Получен аванс: сначала верните деньги клиенту':'';
 A('Заказ выполнен (посылку забрали)',s=='Отправлен','Заказ ещё не отправлен или уже завершён',`setSt(${o._row},'Выполнен')`);A('Отказ от посылки',s=='Отправлен','Заказ ещё не отправлен или уже завершён',`setSt(${o._row},'Отказ')`);
 A('Отменить заказ',!bad,bad);
 return r}

function render(){
 $('#who').textContent=(ME?ME+' · ':'')+'⚙ Настройки';
 const t=$('#tabs');t.hidden=!tok;
 t.innerHTML=[['orders','🧾','Заказы'],['act','⚡','Действия'],['log','🕘','Журнал']].map(([k,ic,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.sub='';render()"><i>${ic}</i>${n}</button>`).join('');
 const a=$('#app');
 if(!SID||!ME)return a.innerHTML=`<div class="card"><h3>Первая настройка</h3>
  <div class="hint">Откройте вашу Google Таблицу и скопируйте адрес из строки браузера целиком, вставьте сюда.</div>
  <input id="sid" placeholder="Адрес или ID Google Таблицы" value="${esc(SID||'')}">
  <div class="hint">Кто вы? Введите своё имя (оно нужно, чтобы показывать вам только чужие изменения).</div>
  <input id="me" placeholder="Ваше имя" value="${esc(ME||'')}">
  <button class="btn" onclick="saveCfg()">Сохранить</button></div>`;
 if(!tok)return a.innerHTML=`<div class="card"><h3>Вход</h3><div class="hint">Нажмите кнопку и выберите рабочий аккаунт Google.</div>
  <button class="btn" onclick="start()">${localStorage.em?'Продолжить как '+esc(localStorage.em):'Войти через Google'}</button><div id="err"></div></div>`;

 const rows=its.map(i=>[i['Код'],i['Название'],i['Размер'],i['Цвет'],num(i['Закуплено шт']),num(i['Стоимость закупки']),o['№']]),logs=[['Возврат посылки',o['№'],'Посылка забрана, товар на складе']];
 if(d)logs.push(['Доставка',o['№'],'Оплачена вами за возврат',-d,'Банк']);if(rs&&val)logs.push(['Склад',o['№'],'Стоимость товара возвращена в Реал',val,'Склад']);
 try{await act({data:wr(o,v),upd:[[o,v]],logs,msg:'Посылка по заказу '+o['№']+' забрана',add:rows.length?[{sheet:'Склад',rows,objs:rows.map(r=>Object.fromEntries(SH['Склад'].map((k,n)=>[k,r[n]])))}]:[]})}catch(e){alert('Не удалось сохранить: '+e.message)}}
function refHtml(){const L=refL();return back+sumc('Нужно вернуть клиентам',money(L.reduce((s,o)=>s+total(o),0)),'по заказам: '+L.length)+`<div class="hint">Сумма предлагается полная, её можно изменить (например, оставить аванс). По заказам Прома и Шафы комиссия банка вернётся сама.</div>`+
 (L.map(o=>`<div class="card">${hd(o)}<div class="mu">Телефон ${esc(o['Телефон'])} · ${o['Состояние посылки']=='Возврат забран'?'посылка у вас ✓':'посылка ещё не у вас'}</div>${itl(o)}
  <label class="mu">Сумма возврата клиенту</label><input id="rf${o._row}" type="number" value="${total(o)}"><button class="btn" onclick="refund(${o._row})">💸 Деньги возвращены</button></div>`).join('')||'<div class="card">Возвратов средств нет</div>')}
async function refund(row){const o=S.orders.find(x=>x._row==row),a=num($('#rf'+row).value);if(!(a>0))return alert('Впишите сумму');
 const bk=['Пром','Шафа'].includes(o['Канал'])?num(o['Комиссия банка']):0,v={'Возвращено клиенту':a,'Реал':rnd(num(o['Реал'])-a+bk)},logs=[['Возврат средств',o['№'],'Деньги возвращены клиенту',-a,'Банк']];
 if(bk)logs.push(['Возврат комиссии банка',o['№'],'Комиссия банка возвращена',bk,'Банк']);
 try{await act({data:wr(o,v),upd:[[o,v]],logs,msg:'Возврат клиенту записан: заказ '+o['№']})}catch(e){alert('Не удалось сохранить: '+e.message)}}
function retHtml(){const L=retL();return back+sumc('Можно оформить возврат',L.length+' заказов','выполненные заказы, у которых не прошло 14 дней')+`<div class="hint">Клиент решил вернуть товар? Нажмите «Оформить возврат». Возвратную ТТН можно вписать сейчас или позже.</div>`+
 (L.map(o=>`<div class="card">${hd(o)}${itl(o)}<div class="mu">Осталось дней на возврат: ${left(o)}</div><input id="rt${o._row}" placeholder="Возвратная ТТН (можно позже)"><button class="btn" onclick="retOrd(${o._row})">🔁 Оформить возврат</button></div>`).join('')||'<div class="card">Нет заказов, которые можно вернуть</div>')}
async function retOrd(row){const o=S.orders.find(x=>x._row==row),v={'Статус':'Возврат','Состояние посылки':'Возврат едет к вам','Возвратная ТТН':$('#rt'+row).value.trim()};
 try{await act({data:wr(o,v),upd:[[o,v]],logs:[['Возврат заказа',o['№'],'Оформлен возврат'+(v['Возвратная ТТН']?', ТТН '+v['Возвратная ТТН']:'')]],msg:'Возврат оформлен: заказ '+o['№']})}catch(e){alert('Не удалось сохранить: '+e.message)}}
async function setSt(row,st){const o=S.orders.find(x=>x._row==row),v=st=='Выполнен'?{'Статус':st,'Состояние посылки':'Забрана','Дата получения':new Date().toISOString().slice(0,10)}:{'Статус':st,'Состояние посылки':'Отказ, посылка едет к вам'};
 try{await act({data:wr(o,v),upd:[[o,v]],logs:[[st=='Выполнен'?'Заказ выполнен':'Отказ от посылки',o['№'],'Статус изменён вручную']],msg:`Заказ ${o['№']}: ${st}`});if($('#ord')){$('#ord').remove();openOrder(o['№'])}}catch(e){alert('Не удалось сохранить: '+e.message)}}
window.addEventListener('load',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
 const t=JSON.parse(localStorage.tk||'null');
 if(SID&&ME&&t&&t.exp>Date.now()){tok=t.tok;start()}
 else if(SID&&ME&&localStorage.em){const w=setInterval(async()=>{if(window.google&&google.accounts){clearInterval(w);try{await auth();start()}catch(e){render()}}},200)}});
</script></body></html>
