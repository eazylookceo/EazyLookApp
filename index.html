<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EazyLook</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fd6">
<style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#161a2b;--mu:#6b7191;--ac:#5b5bd6;--ac2:#8b5cf6;--ln:#e6e8f2;--sh:0 6px 18px #1b1f4a14}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--cd:#181c30;--tx:#eceefb;--mu:#9aa1c4;--ln:#262b47;--sh:0 6px 18px #0007}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;font-size:19px;border-radius:0 0 24px 24px;box-shadow:var(--sh)}
#who{font-size:13px;font-weight:600;background:#fff3;padding:6px 12px;border-radius:99px;cursor:pointer}
main{max-width:860px;margin:auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hint{background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:13.5px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);margin:4px 4px 0 0}
.st{color:#fff;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.it{font-size:13.5px;color:var(--mu);padding:5px 0;border-top:1px solid var(--ln)}
.btn{border:0;border-radius:14px;padding:12px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:var(--ln);color:var(--tx)}.btn.off{background:var(--ln);color:var(--mu);opacity:.7}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;margin:6px 0;background:var(--cd);color:var(--tx);font:inherit}
.tabs{position:fixed;left:12px;right:12px;bottom:12px;display:flex;background:var(--cd);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:6px;z-index:6;max-width:520px;margin:auto}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:18px;color:var(--mu);font-weight:600;font-size:12px;font-family:inherit}.tabs i{display:block;font-style:normal;font-size:20px}.tabs .on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.full{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:14px}.kv b{color:var(--mu);font-weight:500}
.why{font-size:12px;color:#d9485f;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px 12px;box-shadow:var(--sh);cursor:pointer}.tile.dim{opacity:.55}.tile .ic{font-size:28px}.tile small{display:block;color:var(--mu)}
.bdg{position:absolute;top:10px;right:10px;background:#ef4444;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700}
.sech{margin:18px 4px 4px;font-size:15px}.big{font-size:17px;font-weight:700;margin:6px 0 2px}.mu{color:var(--mu);font-size:13px}
.toast{position:fixed;left:12px;right:12px;bottom:92px;max-width:480px;margin:auto;background:#161a2b;color:#fff;border-radius:16px;padding:12px 16px;z-index:30;box-shadow:var(--sh)}.toast button{float:right;border:0;background:#fff3;color:#fff;border-radius:10px;padding:4px 12px}
.art{font-size:24px;font-weight:800;color:var(--ac)}.qty{font-size:20px;font-weight:800;background:color-mix(in srgb,var(--ac) 14%,transparent);padding:2px 12px;border-radius:12px}
.cost{font-size:20px;font-weight:800}.cost small{font-size:12px;font-weight:500;color:var(--mu)}.cont{font-weight:700;margin-top:6px}
.sum{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.sum .mu{color:#ffffffcc}.sum .big{font-size:28px;margin:2px 0}
</style></head><body>
<header><span>EazyLook</span><span id="who" onclick="settings()" style="cursor:pointer"></span></header>
<main id="app"></main>
<div class="tabs" id="tabs" hidden></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID='453855640121-0o20r40ti8vjgtpkmkdhdomdrhttmo1i.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/spreadsheets';
const SH={
'Заказы':['№','Канал','Тип оплаты','Дата','ФИО','Телефон','Перевозчик','ТТН','Состояние посылки','Дата отправки','Дата получения','От ФОП','Условие доставки','Стоимость доставки','Возвратная ТТН','Стоимость возвратной доставки','Аванс','Аванс получен','Выкуп','Комиссия сайта','Комиссия банка','Выплата','Профит','Реал','Статус','Чек выдан'],
'Товары':['№ заказа','Название','Код','Размер','Цвет','Количество','Цена за шт','Стоимость закупки','Закуплено шт'],
'Журнал':['ID','Дата','Кто','Тип','№ заказа','Счёт','Сумма','Остаток после','Описание','Отменена'],
'Склад':['Код','Название','Размер','Цвет','Количество','Цена закупки','Из заказа'],
'Поставщики':['Наш номер','Поставщик','Улица','Контейнер','Актуальный ассортимент','Популярность'],
'Настройки':['Ключ','Значение']};
const ST={'Ожидает подтверждения':'#8a96a8','Новый':'#2a6df4','Закуплен':'#8e44ad','Отправлен':'#d99a00','Выполнен':'#1a9b4b','Отказ':'#d33','Возврат':'#a0201a','Закрыт':'#666','Отменен':'#999'};
const ACTIVE=['Ожидает подтверждения','Новый','Закуплен','Отправлен','Возврат'];
const ACTIONS=['Закупка товара','Отправка заказов','Возврат посылок','Возврат средств','Получение аванса','Выдача чеков','Изменение баланса','Возврат заказа','Возврат комиссии','Сдача товара'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v??'').replace(',','.').replace(/\s/g,''))||0;
const money=v=>num(v).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₴';
const fdate=v=>{const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('ru-RU')};
const fdt=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})};
let tok=null,tc=null,SID=localStorage.sid,ME=localStorage.me,S={orders:[],items:[],log:[],cfg:[],sup:[],sub:'',tab:'orders',flt:'all',q:''};

function auth(){return new Promise((ok,no)=>{
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>r.access_token?(tok=r.access_token,ok()):no(new Error(r.error||'auth'))});
 tc.requestAccessToken({prompt:''});});}
async function g(p,o={}){
 const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SID+p,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});
 if(r.status==401){tok=null;throw new Error('auth')}
 const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Ошибка Google');return j}
const put=(t,v)=>g('/values/'+encodeURIComponent(t)+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:v})});
const app=(t,v)=>g('/values/'+encodeURIComponent(t)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:v})});

async function ensure(){
 const m=await g('?fields=sheets.properties.title'),have=m.sheets.map(s=>s.properties.title),add=Object.keys(SH).filter(k=>!have.includes(k));
 if(add.length){await g(':batchUpdate',{method:'POST',body:JSON.stringify({requests:add.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))})});
  for(const t of add)await put(t+'!A1',[SH[t]]);}}
async function load(){
 const ks=Object.keys(SH),d=await g('/values:batchGet?'+ks.map(k=>'ranges='+encodeURIComponent(k)).join('&')),T={};
 d.valueRanges.forEach((v,i)=>{const r=v.values||[],h=r[0]||SH[ks[i]];T[ks[i]]=r.slice(1).map((row,j)=>{const o={_row:j+2};h.forEach((k,c)=>o[k]=row[c]??'');return o})});
 S.orders=T['Заказы'];S.items=T['Товары'];S.log=T['Журнал'];S.cfg=T['Настройки'];S.sup=T['Поставщики']}
async function addLog(type,order,desc,amount='',acct=''){
 const row=[Date.now(),new Date().toISOString(),ME,type,order,acct,amount,'',desc,''];
 await app('Журнал!A1',[row]);
 S.log.push({ID:row[0],'Дата':row[1],'Кто':ME,'Тип':type,'№ заказа':order,'Описание':desc,'Сумма':amount,'Счёт':acct})}
const seenKey=()=>'seen:'+ME,seenRow=()=>S.cfg.find(r=>r['Ключ']==seenKey());
async function setSeen(){const now=new Date().toISOString(),r=seenRow();
 if(r){await put('Настройки!B'+r._row,[[now]]);r['Значение']=now}else{await app('Настройки!A1',[[seenKey(),now]]);S.cfg.push({'Ключ':seenKey(),'Значение':now,_row:S.cfg.length+2})}}
function news(){const r=seenRow();if(!r)return[];const t=Date.parse(r['Значение']);
 return S.log.filter(e=>Date.parse(e['Дата'])>t&&e['Кто']!=ME&&e['Отменена']!='Да').reverse()}

const itemsOf=o=>S.items.filter(i=>i['№ заказа']==o['№']);
const total=o=>itemsOf(o).reduce((s,i)=>s+num(i['Цена за шт'])*(num(i['Количество'])||1),0);
const allBought=o=>{const it=itemsOf(o);return it.length>0&&it.every(i=>num(i['Закуплено шт'])>=(num(i['Количество'])||1))};
function can(o){ // что можно делать с заказом в его состоянии
 const s=o['Статус'],adv=o['Аванс получен']=='Да',r=[];
 const A=(n,ok,why)=>r.push({n,ok,why});
 A('Добавить комментарий',true);
 A('Изменить заказ (товары, данные)',['Ожидает подтверждения','Новый','Закуплен'].includes(s),'Заказ уже отправлен или закрыт');
 A('Отметить закупку (вкладка «Действия»)',['Новый','Закуплен'].includes(s)&&!allBought(o),allBought(o)?'Всё уже закуплено':'Заказ не в стадии закупки');
 A('Получить аванс',num(o['Аванс'])>0&&!adv&&!['Закрыт','Отменен'].includes(s),num(o['Аванс'])>0?'Аванс уже получен или заказ закрыт':'У заказа нет аванса');
 A('Указать или изменить ТТН',!['Закрыт','Отменен'].includes(s),'Заказ закрыт');
 A('Отправить заказ',['Новый','Закуплен'].includes(s)&&allBought(o),'Сначала нужно закупить все товары');
 A('Оформить возврат заказа',s=='Выполнен','Возврат возможен только у выполненных заказов (14 дней)');
 const bad=['Отправлен','Выполнен','Возврат','Отказ','Закрыт','Отменен'].includes(s)?'Посылка уже в пути или заказ завершён':adv?'Получен аванс: сначала верните деньги клиенту':'';
 A('Отменить заказ',!bad,bad);
 return r}

function render(){
 $('#who').textContent=(ME?ME+' · ':'')+'⚙ Настройки';
 const t=$('#tabs');t.hidden=!tok;
 t.innerHTML=[['orders','🧾','Заказы'],['act','⚡','Действия'],['log','🕘','Журнал']].map(([k,ic,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.sub='';render()"><i>${ic}</i>${n}</button>`).join('');
 const a=$('#app');
 if(!SID||!ME)return a.innerHTML=`<div class="card"><h3>Первая настройка</h3>
  <div class="hint">Откройте вашу Google Таблицу и скопируйте адрес из строки браузера целиком, вставьте сюда.</div>
  <input id="sid" placeholder="Адрес или ID Google Таблицы" value="${esc(SID||'')}">
  <div class="hint">Кто вы? Введите своё имя (оно нужно, чтобы показывать вам только чужие изменения).</div>
  <input id="me" placeholder="Ваше имя" value="${esc(ME||'')}">
  <button class="btn" onclick="saveCfg()">Сохранить</button></div>`;
 if(!tok)return a.innerHTML=`<div class="card"><h3>Вход</h3><div class="hint">Нажмите кнопку и выберите рабочий аккаунт Google.</div>
  <button class="btn" onclick="start()">Войти через Google</button><div id="err"></div></div>`;
 if(S.tab=='orders')return a.innerHTML=ordersHtml();
 if(S.tab=='act')return a.innerHTML=({buy:buyHtml,ship:shipHtml,adv:advHtml}[S.sub]||actHtml)();
 a.innerHTML=`<div class="hint">Журнал: что, когда и по какому заказу происходило.</div>`+S.log.slice(-100).reverse().map(e=>`<div class="card"><div class="row"><b>${esc(e['Тип'])}</b><span>${fdt(e['Дата'])}</span></div>${e['№ заказа']?'Заказ '+esc(e['№ заказа'])+' · ':''}${esc(e['Описание'])}${e['Сумма']?' · '+money(e['Сумма']):''}</div>`).join('')||'<div class="card">Пока пусто</div>'}
function ordersHtml(){
 let L=S.orders.filter(o=>o['№']);const q=S.q.toLowerCase(),m=Date.now()-30*864e5;
 if(S.flt=='act')L=L.filter(o=>ACTIVE.includes(o['Статус']));
 if(S.flt=='mon')L=L.filter(o=>Date.parse(o['Дата'])>=m);
 if(q)L=L.filter(o=>(o['№']+o['ФИО']+o['Телефон']+o['ТТН']+itemsOf(o).map(i=>i['Код']+i['Название']).join(' ')).toLowerCase().includes(q));
 L.sort((a,b)=>(Date.parse(b['Дата'])||0)-(Date.parse(a['Дата'])||0)||b._row-a._row);
 return `<div class="hint">Нажмите на заказ, чтобы открыть его и посмотреть, что с ним можно сделать.</div>
 <input placeholder="Поиск: номер, имя, телефон, ТТН, код" value="${esc(S.q)}" oninput="S.q=this.value;render();this.focus()">
 <div>${[['all','За всё время'],['mon','За месяц'],['act','Активные']].map(([k,n])=>`<button class="btn ${S.flt==k?'':'sec'}" onclick="S.flt='${k}';render()">${n}</button>`).join('')}</div>`+
 `<div class="mu" style="margin:6px 4px">Заказов: ${L.length} · на сумму ${money(L.reduce((s,o)=>s+total(o),0))}</div>`+(L.map(o=>`<div class="card" style="border-left:6px solid ${ST[o['Статус']]||'#888'}" onclick="openOrder('${esc(o['№'])}')"><div class="row"><b>№ ${esc(o['№'])}</b><span class="st" style="background:${ST[o['Статус']]||'#888'}">${esc(o['Статус']||'—')}</span></div>
 <div><span class="chip">${esc(o['Канал'])}</span><span class="chip">${esc(o['Тип оплаты']||'тип оплаты не указан')}</span></div>
 <div class="row"><span>${esc(o['ФИО'])}</span><b>${money(total(o))}</b></div>${itemsOf(o).map(i=>`<div class="it">${esc(i['Код'])} · ${esc(i['Размер'])} · ${esc(i['Цвет'])} × ${esc(i['Количество']||1)}${i['Название']?' · '+esc(i['Название']):''}</div>`).join('')}</div>`).join('')||'<div class="card">Заказов не найдено</div>')}
function openOrder(n){
 const o=S.orders.find(x=>x['№']==n);if(!o)return;const d=document.createElement('div');d.className='full';d.id='ord';
 const F=['Канал','Тип оплаты','Дата','ФИО','Телефон','Перевозчик','ТТН','Состояние посылки','Условие доставки','Стоимость доставки','Аванс','Аванс получен','Выкуп','Комиссия сайта','Комиссия банка','Выплата','Профит','Реал','Чек выдан'];
 const cm=S.log.filter(e=>e['Тип']=='Комментарий'&&e['№ заказа']==n).reverse();
 d.innerHTML=`<button class="btn sec" onclick="this.parentNode.remove()">← Назад к заказам</button><h2>Заказ № ${esc(n)} <span class="st" style="background:${ST[o['Статус']]||'#888'}">${esc(o['Статус'])}</span></h2>
 <div class="card kv">${F.filter(k=>o[k]!=='').map(k=>`<b>${k}</b><span>${k=='Дата'?fdate(o[k]):esc(o[k])}${k=='Телефон'?` <a href="#" onclick="navigator.clipboard.writeText('${esc(o[k])}');return false">копировать</a>`:''}</span>`).join('')}</div>
 <div class="card"><b>Товары</b>${itemsOf(o).map(i=>`<div class="it">${esc(i['Название'])} ${esc(i['Код'])} · ${esc(i['Размер'])} · ${esc(i['Цвет'])} × ${esc(i['Количество'])} · ${money(i['Цена за шт'])} · куплено ${esc(i['Закуплено шт']||0)}</div>`).join('')||'Товаров нет'}</div>
 <div class="card"><b>Что можно сделать</b><div class="hint">Серые кнопки сейчас недоступны, под ними написана причина.</div>${can(o).map((a,i)=>`<div><button class="btn ${a.ok?'':'off'}" onclick="${a.ok?(i==0?"$('#cm').focus()":"alert('Эта функция появится в следующей версии')"):`alert('${esc(a.why)}')`}">${a.n}</button>${a.ok?'':`<div class="why">${esc(a.why)}</div>`}</div>`).join('')}</div>
 <div class="card"><b>Комментарии</b><textarea id="cm" rows="2" placeholder="Напишите комментарий к заказу"></textarea><button class="btn" onclick="addCm('${esc(n)}')">Добавить комментарий</button>
 ${cm.map(e=>`<div class="it">${fdt(e['Дата'])} · ${esc(e['Кто'])}: ${esc(e['Описание'])}</div>`).join('')}</div>`;
 document.body.append(d)}
async function addCm(n){const t=$('#cm').value.trim();if(!t)return;try{await addLog('Комментарий',n,t);$('#ord').remove();render();openOrder(n)}catch(e){alert('Не удалось сохранить: '+e.message)}}
function settings(){if(!confirm('Сменить таблицу или имя? Вы выйдете из приложения и сможете ввести новые данные.'))return;
 try{if(tok)google.accounts.oauth2.revoke(tok)}catch(e){}
 tok=null;SID=ME=undefined;localStorage.removeItem('sid');localStorage.removeItem('me');S.orders=[];S.items=[];S.log=[];S.cfg=[];render()}
function saveCfg(){const m=($('#sid').value||'').match(/\/d\/([\w-]+)/),id=m?m[1]:($('#sid').value||'').trim(),me=$('#me').value.trim();
 if(!id||!me)return alert('Заполните оба поля');SID=localStorage.sid=id;ME=localStorage.me=me;render()}
async function start(){
 try{await auth();$('#app').innerHTML='<div class="card">Загружаю данные…</div>';await ensure();await load();
  const r=seenRow(),n=news();render();
  if(!r){await setSeen()}else if(n.length)showNews(n);else await setSeen()}
 catch(e){tok=null;render();$('#err').innerHTML=`<div class="hint">Не получилось: ${esc(e.message)}. Проверьте адрес таблицы и доступ аккаунта.</div>`}}
function showNews(n){const d=document.createElement('div');d.className='full';
 d.innerHTML=`<h2>Что нового, пока вас не было</h2><div class="hint">Это изменения других людей с вашего прошлого визита.</div>`+
 n.slice(0,200).map(e=>`<div class="card"><div class="row"><b>${esc(e['Тип'])}</b><span>${fdt(e['Дата'])} · ${esc(e['Кто'])}</span></div>${e['№ заказа']?'Заказ '+esc(e['№ заказа'])+' · ':''}${esc(e['Описание'])}</div>`).join('')+
 `<button class="btn" onclick="this.parentNode.remove();setSeen()">Понятно, продолжить</button>`;document.body.append(d)}
const IC={'Закупка товара':'🛒','Отправка заказов':'📦','Возврат посылок':'↩️','Возврат средств':'💸','Получение аванса':'💰','Выдача чеков':'🧾','Изменение баланса':'🏦','Возврат заказа':'🔁','Возврат комиссии':'🏷️','Сдача товара':'🏭'};
const sup=c=>S.sup.find(s=>String(s['Наш номер'])==String(c).split('/')[0])||{};
const toBuy=()=>S.items.map(i=>({i,o:S.orders.find(o=>o['№']==i['№ заказа'])})).filter(x=>x.o&&x.o['Статус']=='Новый'&&num(x.i['Закуплено шт'])<(num(x.i['Количество'])||1));
const cl=v=>String(v??'').replace(/\.0+$/,'');
const CAR=['Нова Пошта','Meest','Розетка','Укрпошта'],SUB={'Закупка товара':'buy','Отправка заказов':'ship','Получение аванса':'adv'};
const advL=()=>S.orders.filter(o=>num(o['Аванс'])>0&&o['Аванс получен']!='Да'&&!['Отменен','Закрыт'].includes(o['Статус']));
const back=`<button class="btn sec" onclick="S.sub='';render()">← Все действия</button>`;
const sumc=(a,b,c)=>`<div class="card sum"><div class="mu">${a}</div><div class="big">${b}</div><div class="mu">${c}</div></div>`;
function actHtml(){const cnt={buy:toBuy().length,ship:S.orders.filter(o=>o['Статус']=='Закуплен').length,adv:advL().length};
 return `<div class="hint">Выберите, что хотите сделать. Цифра на плитке показывает, сколько дел ждёт вас.</div><div class="grid">`+ACTIONS.map(n=>{const k=SUB[n];return `<div class="tile ${k?'':'dim'}" onclick="${k?`S.sub='${k}';render()`:"toast('Появится в следующей версии')"}"><div class="ic">${IC[n]}</div><b>${n}</b>${k&&cnt[k]?`<span class="bdg">${cnt[k]}</span>`:''}${k?'':'<small>скоро</small>'}</div>`}).join('')+`</div>`}
function buyHtml(){const G={};let tq=0,tm=0,np=0;
 toBuy().forEach(x=>{const s=sup(x.i['Код']),k=s['Улица']||'Улица не указана',q=(num(x.i['Количество'])||1)-num(x.i['Закуплено шт']);tq+=q;tm+=q*num(x.i['Стоимость закупки']);np++;(G[k]=G[k]||[]).push({...x,s,q})});
 const ks=Object.keys(G).sort();
 return back+sumc('Нужно купить',money(tm),`${tq} шт · ${np} позиций · улиц: ${ks.length}`)+
 (ks.map(k=>{const a=G[k];return `<h3 class="sech">📍 ${esc(k)} <span class="mu">· ${a.reduce((n,x)=>n+x.q,0)} шт · ${money(a.reduce((n,x)=>n+x.q*num(x.i['Стоимость закупки']),0))}</span></h3>`+
  a.sort((x,y)=>num(x.s['Контейнер'])-num(y.s['Контейнер'])||String(x.i['Код']).localeCompare(y.i['Код'])).map(({i,o,s,q})=>`<div class="card">
  <div class="row"><span class="art">${esc(i['Код'])}</span><span class="qty">× ${q} шт</span></div>
  <div class="big">${esc(i['Цвет'])} · р. ${esc(i['Размер'])}</div>
  <div class="row"><span class="cost">${money(i['Стоимость закупки'])} <small>за шт</small></span><span class="mu">итого ${money(q*num(i['Стоимость закупки']))}</span></div>
  <div class="cont">${esc(s['Поставщик']||'Поставщик не найден (№ '+String(i['Код']).split('/')[0]+')')} ${esc(cl(s['Контейнер']))}</div>${i['Название']?`<div class="mu">${esc(i['Название'])}</div>`:''}
  <div class="mu">Заказ ${esc(o['№'])} · ${esc(o['Канал'])} · ${esc(o['ФИО'])}</div>
  <button class="btn" onclick="buy(${i._row},${q})">✓ Куплено</button><button class="btn sec" onclick="editItem(${i._row})">✎ Изменить</button></div>`).join('')}).join('')||'<div class="card">Всё закуплено 🎉</div>')}
function shipHtml(){const L=S.orders.filter(o=>o['Статус']=='Закуплен');
 return back+sumc('К отправке',L.length+' заказов','на сумму '+money(L.reduce((s,o)=>s+total(o),0)))+`<div class="hint">Выберите службу доставки и впишите ТТН. Если доставку оплатили вы, впишите сумму.</div>`+
 (L.map(o=>`<div class="card"><div class="row"><b>№ ${esc(o['№'])}</b><span class="chip">${esc(o['Канал'])}</span></div><div class="big">${esc(o['ФИО'])}</div>${itemsOf(o).map(i=>`<div class="it"><b>${esc(i['Код'])}</b> · ${esc(i['Цвет'])} · р. ${esc(i['Размер'])} × ${esc(i['Количество'])}${i['Название']?' · '+esc(i['Название']):''}</div>`).join('')}
  <select id="c${o._row}">${CAR.map(c=>`<option ${o['Перевозчик']==c?'selected':''}>${c}</option>`).join('')}</select><input id="t${o._row}" placeholder="ТТН" value="${esc(o['ТТН'])}"><input id="d${o._row}" type="number" placeholder="Сколько заплатили вы за доставку (если платили)"><button class="btn" onclick="ship(${o._row})">📦 Отправлено</button></div>`).join('')||'<div class="card">Нет заказов к отправке</div>')}
async function ship(row){const o=S.orders.find(x=>x._row==row),c=$('#c'+row).value,t=$('#t'+row).value.trim(),d=num($('#d'+row).value);
 if(!t)return alert('Впишите ТТН');if(!confirm(`Отправили заказ ${o['№']} (${c}, ТТН ${t})?`))return;
 const day=new Date().toISOString().slice(0,10),nd=num(o['Стоимость доставки'])+d,re=Math.round((num(o['Реал'])-d)*100)/100,sp='В пути или ждёт в отделении';
 try{await g('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:[{range:`Заказы!G${row}:J${row}`,values:[[c,t,sp,day]]},{range:'Заказы!N'+row,values:[[nd||'']]},{range:`Заказы!X${row}:Y${row}`,values:[[re,'Отправлен']]}]})});
  Object.assign(o,{'Перевозчик':c,'ТТН':t,'Состояние посылки':sp,'Дата отправки':day,'Стоимость доставки':nd||'','Реал':re,'Статус':'Отправлен'});
  await addLog('Отправка',o['№'],`${c}, ТТН ${t}`);if(d)await addLog('Доставка',o['№'],'Оплачена вами при отправке',-d,'Банк');render();toast('Заказ отправлен')}catch(e){alert('Не удалось сохранить: '+e.message)}}
function advHtml(){const L=advL();
 return back+sumc('Ожидается аванс',money(L.reduce((s,o)=>s+num(o['Аванс']),0)),'по заказам: '+L.length)+`<div class="hint">Клиент заплатил аванс? Нажмите «Аванс получен». Сумму можно изменить, Выкуп пересчитается.</div>`+
 (L.map(o=>`<div class="card"><div class="row"><b>№ ${esc(o['№'])}</b><span class="chip">${esc(o['Канал'])}</span></div><div class="big">${esc(o['ФИО'])}</div><div class="mu">Телефон ${esc(o['Телефон'])} · сумма заказа ${money(total(o))}</div><input id="a${o._row}" type="number" value="${num(o['Аванс'])}"><button class="btn" onclick="gotAdv(${o._row})">💰 Аванс получен</button></div>`).join('')||'<div class="card">Все авансы получены</div>')}
async function gotAdv(row){const o=S.orders.find(x=>x._row==row),a=num($('#a'+row).value);if(!(a>0))return alert('Впишите сумму аванса');if(!confirm(`Получили аванс ${money(a)} по заказу ${o['№']}?`))return;
 const vy=Math.max(total(o)-a,0),re=Math.round((num(o['Реал'])+a)*100)/100;
 try{await g('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:[{range:`Заказы!Q${row}:S${row}`,values:[[a,'Да',vy]]},{range:'Заказы!X'+row,values:[[re]]}]})});
  Object.assign(o,{'Аванс':a,'Аванс получен':'Да','Выкуп':vy,'Реал':re});await addLog('Аванс',o['№'],'Аванс получен',a,'Банк');render();toast('Аванс записан')}catch(e){alert('Не удалось сохранить: '+e.message)}}
async function buy(row,q,undo){const i=S.items.find(x=>x._row==row),o=S.orders.find(x=>x['№']==i['№ заказа']),amt=q*num(i['Стоимость закупки']),nb=num(i['Закуплено шт'])+q;
 const all=itemsOf(o).every(x=>(x===i?nb:num(x['Закуплено шт']))>=(num(x['Количество'])||1)),stt=all?'Закуплен':(o['Статус']=='Закуплен'?'Новый':o['Статус']),re=Math.round((num(o['Реал'])-amt)*100)/100;
 try{await g('/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:[{range:'Товары!I'+row,values:[[nb]]},{range:'Заказы!X'+o._row,values:[[re]]},{range:'Заказы!Y'+o._row,values:[[stt]]}]})});
  i['Закуплено шт']=nb;o['Реал']=re;o['Статус']=stt;
  await addLog('Закупка',o['№'],(undo?'Отмена закупки: ':'Куплено: ')+`${Math.abs(q)} шт · ${i['Код']} · ${i['Цвет']} · р. ${i['Размер']}`,-amt,'Банк');
  render();toast(undo?'Закупка отменена':'Отмечено: куплено',undo?undefined:()=>buy(row,-q,true))}catch(e){alert('Не удалось сохранить: '+e.message)}}
const EK=['Название','Код','Размер','Цвет','Количество','Цена за шт','Стоимость закупки'];
function editItem(row){const i=S.items.find(x=>x._row==row),d=document.createElement('div');d.className='full';d.id='ed';
 d.innerHTML=`<button class="btn sec" onclick="this.parentNode.remove()">← Назад</button><h2>Изменить товар</h2><div class="hint">Если меняете модель, укажите новую цену и закупку.</div><div class="card">`+EK.map((k,n)=>`<label class="mu">${k}</label><input id="f${n}" value="${esc(i[k])}">`).join('')+`<button class="btn" onclick="saveItem(${row})">Сохранить</button></div>`;document.body.append(d)}
async function saveItem(row){const i=S.items.find(x=>x._row==row),r=EK.map((k,n)=>document.getElementById('f'+n).value.trim()),was=EK.map(k=>String(i[k]));
 if(r[1]!=was[1]&&r[5]==was[5]&&r[6]==was[6]&&!confirm('Вы изменили модель, но цена и закупка прежние. Оставить так?'))return;
 const v=r.map((x,n)=>n>3?num(x):x);if(!v[4])v[4]=1;
 try{await put('Товары!B'+row+':H'+row,[v]);EK.forEach((k,n)=>i[k]=v[n]);
  await addLog('Изменение заказа',i['№ заказа'],'Товар изменён: '+EK.map((k,n)=>was[n]!=String(v[n])?`${k}: ${was[n]} → ${v[n]}`:'').filter(Boolean).join('; '));$('#ed').remove();render();toast('Сохранено')}catch(e){alert('Не удалось сохранить: '+e.message)}}
function toast(t,undo){const d=document.createElement('div');d.className='toast';d.innerHTML=esc(t)+(undo?' <button onclick="this.parentNode.remove();window._u()">Отменить</button>':'');if(undo)window._u=undo;document.body.append(d);setTimeout(()=>d.remove(),7000)}
window.addEventListener('load',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render()});
</script></body></html>
